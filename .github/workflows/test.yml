name: Tests

on:
  push:
    branches: [ main, develop, master, 'loop/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=circus --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint with ruff
      run: |
        ruff check circus/ tests/

  node-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run Node tests with count assertion
      run: |
        set -e
        EXPECTED_TEST_COUNT=26
        npm test > test-output.txt 2>&1 || true
        cat test-output.txt
        ACTUAL_COUNT=$(grep "^# tests " test-output.txt | awk '{print $3}')
        echo "Expected: $EXPECTED_TEST_COUNT tests"
        echo "Actual: $ACTUAL_COUNT tests"
        if [ "$ACTUAL_COUNT" != "$EXPECTED_TEST_COUNT" ]; then
          echo "ERROR: Test count mismatch! Expected $EXPECTED_TEST_COUNT but found $ACTUAL_COUNT"
          exit 1
        fi
        if grep -q "^# fail [1-9]" test-output.txt; then
          echo "ERROR: Some tests failed"
          exit 1
        fi
        echo "All $ACTUAL_COUNT tests passed"

  mutation-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run mutation check
      run: |
        npm run mutation-check
